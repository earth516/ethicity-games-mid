<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주인공 시안 · 맵과 초상화</title>
<style>body{margin:30px;background:#edf1ed;color:#243d3a;font-family:system-ui,sans-serif}h1{font-size:26px}p{line-height:1.65}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1200px}article{background:#fff;border:1px solid #cbd7d0;border-radius:14px;padding:20px}h2{font-size:19px;margin:0 0 12px}.art{width:100%;height:320px;object-fit:contain;background:#e4ece5;border-radius:8px}.samples{display:flex;align-items:flex-end;gap:22px;min-height:150px;padding:14px;background:#d8c4a4;margin-top:12px;border-radius:8px}.samples canvas{image-rendering:pixelated}small{display:block;font-size:12px;color:#52675c;margin-top:8px}.dialogue{padding:16px;background:#f2f6f3;border-left:4px solid #477b72;margin-top:12px}.dialogue p{margin:7px 0 0}footer{font-size:13px;margin-top:20px}@media(max-width:700px){main{grid-template-columns:1fr}body{margin:16px}}</style>
<h1>주인공 캐릭터 시안</h1><p>같은 인물의 맵 정면과 대화용 초상화입니다. 걷기 시트·표정 세트는 아직 제작 전입니다.<br>아래는 에셋 확인용 화면이며 실제 게임 연결 화면이 아닙니다.</p><main></main><footer>48×72 샘플은 고해상도 원본의 단순 축소입니다. 최종 픽셀 프레임은 별도 정리가 필요합니다.</footer>
<script>
const entries=[['boy-map-front','남학생 · 맵 정면'],['boy-portrait','남학생 · 대화 초상화'],['girl-map-front','여학생 · 맵 정면'],['girl-portrait','여학생 · 대화 초상화']];window.assetChecks=[];
entries.forEach(([name,label])=>{const card=document.createElement('article'),title=document.createElement('h2'),c=document.createElement('canvas'),meta=document.createElement('small');title.textContent=label;c.width=600;c.height=600;c.className='art';card.append(title,c);document.querySelector('main').append(card);const im=new Image();im.onload=()=>{const temp=document.createElement('canvas');temp.width=im.width;temp.height=im.height;const g=temp.getContext('2d');g.drawImage(im,0,0);const data=g.getImageData(0,0,im.width,im.height).data;let l=im.width,t=im.height,r=-1,b=-1,transparent=0;for(let y=0;y<im.height;y++)for(let x=0;x<im.width;x++){const a=data[(y*im.width+x)*4+3];if(a===0)transparent++;if(a<16)continue;l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x);b=Math.max(b,y);}const box=[l,t,r-l+1,b-t+1];function render(canvas,padding){const ctx=canvas.getContext('2d'),s=Math.min((canvas.width-padding*2)/box[2],(canvas.height-padding*2)/box[3]);ctx.drawImage(im,...box,(canvas.width-box[2]*s)/2,canvas.height-padding-box[3]*s,box[2]*s,box[3]*s);}render(c,18);if(name.includes('map-front')){const row=document.createElement('div');row.className='samples';[1,2].forEach(scale=>{const group=document.createElement('div'),sample=document.createElement('canvas'),note=document.createElement('small');sample.width=48*scale;sample.height=72*scale;sample.style.width=sample.width+'px';sample.style.height=sample.height+'px';render(sample,scale*2);note.textContent=sample.width+' × '+sample.height;group.append(sample,note);row.append(group);});card.append(row);}else{const d=document.createElement('div');d.className='dialogue';const who=document.createElement('strong'),line=document.createElement('p');who.textContent='플레이어';line.textContent='공유하기 전에, 친구한테 먼저 물어볼까?';d.append(who,line);card.append(d);}meta.textContent=name+'.png · '+im.width+' × '+im.height;card.append(meta);window.assetChecks.push({name,width:im.width,height:im.height,box,transparent});};im.onerror=()=>window.assetChecks.push({name,error:true});im.src=name+'.png';});
</script></html>
