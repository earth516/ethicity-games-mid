<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탐험 아이콘</title><style>body{font:17px/1.7 sans-serif;background:#e9f2de;color:#17334c;padding:24px}main{display:flex;flex-wrap:wrap;gap:24px}figure{margin:0;padding:20px;background:#fff9e9;border-radius:12px}img{object-fit:contain;image-rendering:pixelated}figcaption{margin-top:12px}</style><h1>탐험 아이콘 · 40px / 80px</h1><main id="icons"></main><script>for(const [file,title] of [['quest','다음 사건'],['talk','대화'],['inspect','조사'],['complete','완료']]){const figure=document.createElement('figure');for(const size of [40,80]){const im=new Image(size,size);im.src=file+'.png';im.alt=title;figure.append(im);}const cap=document.createElement('figcaption');cap.textContent=title;figure.append(cap);document.getElementById('icons').append(figure);}</script></html>
